name: development

on:
  push:
    branches: [ main ]

jobs:
  run:
    name: Build, analyze, test and scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: root
          POSTGRES_PASSWORD: root
          POSTGRES_USER: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d root"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://root:root@127.0.0.1:5432/root?serverVersion=18&charset=utf8
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: sync://
      XDEBUG_MODE: coverage

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: symfony-application:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run static analysis, tests and quality checks
        run: |
          docker run --name symfony-quality --network host \
            --env APP_ENV --env DATABASE_URL --env MAILER_DSN \
            --env MESSENGER_TRANSPORT_DSN --env XDEBUG_MODE \
            --env COMPOSER_ROOT_VERSION=dev-main \
            "symfony-application:${{ github.sha }}" quality

      - name: Copy code coverage reports
        run: |
          mkdir -p var/coverage
          docker cp symfony-quality:/opt/project/var/coverage/. var/coverage/

      - name: Upload code coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: var/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: opifex/symfony

      - name: Scan Docker image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: symfony-application:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.70.0
