name: development

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          tags: symfony-application:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  quality:
    name: Quality
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: root
          POSTGRES_PASSWORD: root
          POSTGRES_USER: root
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://root:root@127.0.0.1:5432/root?serverVersion=18&charset=utf8
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: sync://
      XDEBUG_MODE: coverage

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load --input "$RUNNER_TEMP/image.tar"

      - name: Run static analysis, tests and quality checks
        run: |
          docker run --name symfony-quality --network host \
            --env APP_ENV --env DATABASE_URL --env MAILER_DSN \
            --env MESSENGER_TRANSPORT_DSN --env XDEBUG_MODE \
            --env COMPOSER_ROOT_VERSION=dev-main \
            "symfony-application:${{ github.sha }}" quality

      - name: Export code coverage reports
        run: |
          mkdir -p var/coverage
          docker cp symfony-quality:/opt/project/var/coverage/. var/coverage/

      - name: Save code coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: var/coverage
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Copy code coverage reports
        uses: actions/download-artifact@v8
        with:
          name: code-coverage
          path: var/coverage

      - name: Upload code coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: var/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: opifex/symfony

  security:
    name: Security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Scan Docker image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.70.0
