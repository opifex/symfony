name: CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_image:
    name: Build application image
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          pull: true
          tags: symfony-application:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=symfony-application
          cache-to: type=gha,mode=max,scope=symfony-application

      - name: Upload Docker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  check_quality:
    name: Run code quality checks
    needs: build_image
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: root
          POSTGRES_PASSWORD: root
          POSTGRES_USER: root
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://root:root@127.0.0.1:5432/root?serverVersion=18&charset=utf8
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: sync://
      XDEBUG_MODE: off

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load --input "$RUNNER_TEMP/image.tar"

      - name: Run code quality checks
        run: |
          docker run --name symfony-quality --network host \
            --env APP_ENV --env DATABASE_URL --env MAILER_DSN \
            --env MESSENGER_TRANSPORT_DSN --env XDEBUG_MODE \
            "symfony-application:${{ github.sha }}" quality

      - name: Export code coverage report
        run: docker cp symfony-quality:/opt/project/var/coverage/clover.xml "$RUNNER_TEMP/coverage.xml"

      - name: Save code coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage
          path: ${{ runner.temp }}/coverage.xml
          retention-days: 1
          if-no-files-found: error

  upload_coverage:
    name: Upload code coverage
    needs: check_quality
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download code coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-coverage
          path: ${{ runner.temp }}

      - name: Upload code coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          files: ${{ runner.temp }}/coverage.xml

  scan_vulnerabilities:
    name: Scan image vulnerabilities
    needs: build_image
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Scan Docker image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: v0.75.0
