framework:
  messenger:
    default_bus: default.bus
    failure_transport: failed
    buses:
      default.bus:
        default_middleware: allow_no_handlers
        middleware:
          - application_correlation_id
          - doctrine_ping_connection
          - doctrine_close_connection
      command.bus:
        middleware:
          - application_correlation_id
          - application_message_validation
          - doctrine_ping_connection
          - doctrine_close_connection
          - doctrine_transaction
          - application_domain_event
      query.bus:
        middleware:
          - application_correlation_id
          - application_message_validation
          - doctrine_ping_connection
          - doctrine_close_connection
      event.bus:
        default_middleware: allow_no_handlers
        middleware:
          - application_correlation_id
          - doctrine_ping_connection
          - doctrine_close_connection
          - doctrine_transaction
    transports:
      domain_events:
        dsn: doctrine://default?queue_name=domain_events
        options:
          table_name: messenger
        retry_strategy:
          delay: 60000
          max_retries: 3
          multiplier: 1
      notifier_emails:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          exchange:
            default_publish_routing_key: normal
            name: '%env(APP_NAME)%.notifier_emails.direct'
            type: direct
          queues:
            '%env(APP_NAME)%.notifier_emails.direct':
              binding_keys: [ normal ]
        retry_strategy:
          delay: 60000
          max_retries: 3
          multiplier: 1
      webhook_events:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          exchange:
            default_publish_routing_key: normal
            name: '%env(APP_NAME)%.webhook_events.direct'
            type: direct
          queues:
            '%env(APP_NAME)%.webhook_events.direct':
              binding_keys: [ normal ]
        retry_strategy:
          delay: 60000
          max_retries: 3
          multiplier: 1
      failed:
        dsn: doctrine://default?queue_name=failed
        options:
          table_name: messenger
    routing:
      App\Domain\Account\Event\AccountRegisteredEvent: domain_events
      Symfony\Component\Mailer\Messenger\SendEmailMessage: notifier_emails
      Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage: webhook_events
