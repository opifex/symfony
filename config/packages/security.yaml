security:
  providers:
    database:
      id: App\Infrastructure\Security\UserProvider\DatabaseUserProvider
  password_hashers:
    App\Infrastructure\Security\AuthenticatedUser\PasswordAuthenticatedUser:
      algorithm: argon2id
  firewalls:
    development:
      pattern: ^/(_(profiler|wdt))
      security: false
    availability:
      pattern: ^/api/v1/health$
      security: false
    authentication:
      stateless: true
      pattern: ^/api/v1/auth/signin
      provider: database
      user_checker: App\Infrastructure\Security\AuthenticatedUser\PasswordAuthenticatedUserChecker
      custom_authenticators:
        - App\Infrastructure\Security\Authenticator\JsonLoginAuthenticator
    authorization:
      stateless: true
      pattern: ^/api
      access_token:
        token_handler: App\Infrastructure\Security\AccessToken\JwtAccessTokenHandler
  access_control:
    - { path: '^/api/v1/auth/signin$', roles: PUBLIC_ACCESS }
    - { path: '^/api/v1/auth/signup$', roles: PUBLIC_ACCESS }
    - { path: '^/api', roles: IS_AUTHENTICATED_FULLY }
  role_hierarchy:
    ROLE_ADMIN: [ ROLE_USER ]

when@test:
  security:
    password_hashers:
      App\Infrastructure\Security\AuthenticatedUser\PasswordAuthenticatedUser:
        algorithm: bcrypt
        cost: 4
