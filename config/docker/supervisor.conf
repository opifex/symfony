[supervisord]
logfile = /dev/null
logfile_maxbytes = 0
loglevel = error
nodaemon = true
pidfile = /usr/local/var/run/supervisord.pid
user = root

[supervisorctl]
serverurl = unix:///usr/local/var/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file = /usr/local/var/run/supervisord.sock
chmod = 0700

[program:nginx]
autorestart = true
autostart = true
command = nginx
priority = 2
redirect_stderr = false
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stopsignal = QUIT
stopwaitsecs = 90

[program:php-fpm]
autorestart = true
autostart = true
command = php-fpm
priority = 1
redirect_stderr = false
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stopsignal = QUIT
stopwaitsecs = 90
