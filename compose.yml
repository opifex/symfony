services:
  application:
    build:
      context: .
      target: development
    hostname: application
    container_name: "${APP_NAME}-application"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    restart: unless-stopped
    stop_grace_period: 190s
    healthcheck:
      test: [ "CMD", "supervisorctl", "-c", "/etc/supervisor/supervisord.conf", "status", "all" ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      mailcatcher: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    volumes:
      - ./:/opt/project:consistent
    networks:
      internal:

  messenger:
    build:
      context: .
      target: development
    hostname: messenger
    command: messenger
    container_name: "${APP_NAME}-messenger"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    restart: unless-stopped
    stop_grace_period: 70s
    healthcheck:
      test: [ "CMD", "supervisorctl", "-c", "/etc/supervisor/messenger.conf", "status", "all" ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      mailcatcher: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      migration: { condition: service_completed_successfully }
    volumes:
      - ./:/opt/project:consistent
    networks:
      internal:

  migration:
    build:
      context: .
      target: development
    hostname: migration
    command: migration
    container_name: "${APP_NAME}-migration"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    healthcheck:
      test: [ "NONE" ]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./:/opt/project:consistent
    networks:
      internal:

  redis:
    image: redis:8.10.2
    hostname: redis
    container_name: "${APP_NAME}-redis"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-e", "ping" ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      internal:

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    container_name: "${APP_NAME}-rabbitmq"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-ec", ": > /dev/tcp/127.0.0.1/5672" ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      internal:

  postgres:
    image: postgres:18.6
    hostname: postgres
    container_name: "${APP_NAME}-postgres"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -t 2" ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: symfony
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      internal:

  mailcatcher:
    image: opifex/mailcatcher:latest
    hostname: mailcatcher
    container_name: "${APP_NAME}-mailcatcher"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "nc", "-z", "-w", "2", "127.0.0.1", "1025" ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    ports:
      - "1088:1080"
    networks:
      internal:

volumes:
  postgres:
  rabbitmq:
  redis:

networks:
  internal:
    name: "${APP_NAME}-network"
